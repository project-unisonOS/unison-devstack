name: Devstack E2E Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'scripts/e2e_smoke.py'
      - '.github/workflows/e2e-smoke.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout devstack in workspace topology
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: unison-workspace/devstack

      - name: Materialize service repositories
        shell: bash
        run: |
          set -euo pipefail
          repositories=(
            unison-actuation
            unison-agent-vdi
            unison-auth
            unison-capabilities
            unison-common
            unison-comms
            unison-consent
            unison-context
            unison-context-graph
            unison-experience-renderer
            unison-inference
            unison-intent-graph
            unison-io-bci
            unison-io-core
            unison-io-speech
            unison-io-vision
            unison-network-vpn
            unison-orchestrator
            unison-payments
            unison-policy
            unison-storage
          )
          for repository in "${repositories[@]}"; do
            git clone --depth 1 \
              "https://github.com/project-unisonOS/${repository}.git" \
              "${GITHUB_WORKSPACE}/${repository}"
          done

          git clone --depth 1 \
            https://github.com/project-unisonOS/unison-workspace.git \
            "${RUNNER_TEMP}/unison-workspace-source"
          cp -R "${RUNNER_TEMP}/unison-workspace-source/manifests" \
            "${GITHUB_WORKSPACE}/unison-workspace/manifests"
          mkdir -p "${GITHUB_WORKSPACE}/schemas" \
            "${GITHUB_WORKSPACE}/traces" \
            "${GITHUB_WORKSPACE}/var/traces"
          cp -R "${GITHUB_WORKSPACE}/unison-orchestrator/schemas/phase1" \
            "${GITHUB_WORKSPACE}/schemas/phase1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and start devstack
        working-directory: unison-workspace/devstack
        run: |
          docker compose up -d --build
          # Wait briefly for services to be ready
          sleep 5

      - name: Install Python deps for script
        run: |
          python3 -V
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Run E2E smoke script against localhost
        working-directory: unison-workspace/devstack
        env:
          UNISON_ORCH_URL: http://localhost:8080
          UNISON_CONTEXT_URL: http://localhost:8081
          UNISON_IOCORE_URL: http://localhost:8085
          UNISON_POLICY_URL: http://localhost:8083
          UNISON_PERSON_ID: local-user
        run: |
          python3 scripts/e2e_smoke.py

      - name: Dump logs on failure
        if: failure()
        working-directory: unison-workspace/devstack
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Teardown
        if: always()
        working-directory: unison-workspace/devstack
        run: |
          docker compose down -v
