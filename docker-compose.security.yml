name: unison-devstack

# Security overlay for the canonical devstack compose.
# Use with:
#   docker compose -p unison-devstack -f docker-compose.yml -f docker-compose.security.yml up -d
#
# Goals:
# - Segment networks (public/internal/data/auth)
# - Keep services off the host network (do NOT include docker-compose.ports.yml)
# - Apply basic hardening knobs without breaking local dev ergonomics

services:
  # Public edge (no host ports by default in security mode).
  orchestrator:
    networks: [public, internal, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      UNISON_ALLOW_HS256_SERVICE_TOKENS: "false"
      UNISON_SERVICE_SECRET: ""
      UNISON_CAPABILITY_BEARER_TOKEN: ""
      UNISON_CONSENT_SECRET: ""
      DISABLE_AUTH_FOR_TESTS: "false"

  experience-renderer:
    networks: [public, internal, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      AUTH_BASE_URL: http://auth:8088
      DISABLE_AUTH_FOR_TESTS: "false"

  # Internal app network.
  actuation:
    networks: [internal, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      ACTUATION_SERVICE_TOKEN: ""
      VDI_AGENT_TOKEN: ""

  comms:
    networks: [internal, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      COMMS_ROOT_KEY_FILE: /run/secrets/unison_comms_root
      GMAIL_USERNAME: ""
      GMAIL_APP_PASSWORD: ""
    secrets: [unison_comms_root]

  inference:
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  io-core:
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  io-speech:
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  io-vision:
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  io-bci:
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  intent-graph:
    networks: [internal, data]
    security_opt: ["no-new-privileges:true"]

  context-graph:
    networks: [internal, data]
    security_opt: ["no-new-privileges:true"]

  # Auth plane.
  auth:
    networks: [auth, data]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - unison_data:/var/lib/unison
    environment:
      UNISON_AUTH_KEYS_DIR: /var/lib/unison/auth/keys
      UNISON_AUTH_IDENTITY_DATABASE_PATH: /var/lib/unison/auth/identity.db
      UNISON_AUTH_BOOTSTRAP_TOKEN_FILE: /run/secrets/unison_bootstrap_token
      AUTH_JWT_SECRET: ""
      UNISON_JWT_SECRET: ""
      UNISON_ORCHESTRATOR_SERVICE_SECRET: ""
      UNISON_INFERENCE_SERVICE_SECRET: ""
      UNISON_POLICY_SERVICE_SECRET: ""
      UNISON_CONTEXT_SERVICE_SECRET: ""
      UNISON_STORAGE_SERVICE_SECRET: ""
    secrets: [unison_bootstrap_token]

  consent:
    networks: [auth, data, internal]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088

  policy:
    networks: [internal, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088

  # Data plane.
  context:
    networks: [internal, data, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      UNISON_CONTEXT_PROFILE_KEY_FILE: /run/secrets/unison_context_root
      UNISON_REQUIRE_CONSENT: "true"
      UNISON_CONSENT_SERVICE_URL: http://consent:7072
    secrets: [unison_context_root]

  storage:
    networks: [internal, data, auth]
    security_opt: ["no-new-privileges:true"]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      STORAGE_OBJECT_ENC_KEY_FILE: /run/secrets/unison_storage_root
    secrets: [unison_storage_root]

  postgres:
    networks: [data]

  redis:
    networks: [data]

  neo4j:
    networks: [data]

  # Observability stays internal in security mode.
  jaeger:
    networks: [internal]

  # VPN/VDI: keep wiring, but don't publish to host by default in security mode.
  network-vpn:
    networks:
      internal:
        aliases:
          - agent-vdi

  # Optional tooling profiles (keep internal-only).
  ollama:
    networks: [internal]

  payments:
    networks: [internal, auth]
    environment:
      UNISON_AUTH_SERVICE_URL: http://auth:8088
      UNISON_AUTH_SECRET: ""

  capability:
    networks: [internal, auth]
    environment:
      UNISON_CAPABILITY_AUTH_MODE: unison_jwt
      UNISON_CAPABILITY_BEARER_TOKEN: ""
      UNISON_AUTH_SERVICE_URL: http://auth:8088

networks:
  public: {}
  internal:
    internal: true
  data:
    internal: true
  auth:
    internal: true

secrets:
  unison_bootstrap_token:
    file: ${UNISON_SECRET_DIR:-.secrets}/bootstrap-token
  unison_comms_root:
    file: ${UNISON_SECRET_DIR:-.secrets}/comms-root
  unison_context_root:
    file: ${UNISON_SECRET_DIR:-.secrets}/context-root
  unison_storage_root:
    file: ${UNISON_SECRET_DIR:-.secrets}/storage-root
